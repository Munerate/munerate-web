<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>munerate — field prototype</title>
  <link rel="icon" href="../public/favicon.svg" />
  <style>
    /* Mirrors src/styles/tokens.css + globals.css closely enough to judge the field.
     This page is a playground for the animation only — the real page is Next. */
    :root {
      --navy: #0a1b2e;
      --teal: #10b39e;
      --mint: #7ee6d1;
      --paper: #e8ecef;
      --cream: #f7f3e9;
      --ink-soft: color-mix(in oklab, var(--navy) 62%, var(--cream));
    }

    /* Dark mode — the engraver's plate. Prototype-local variable flip. */
    html[data-theme="dark"] {
      --cream: #071220;
      --navy: #e8ecef;
      --ink-soft: color-mix(in oklab, #e8ecef 64%, #071220);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--cream);
      color: var(--navy);
      font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    canvas.field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .landing {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.25rem, 4vw, 3rem);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .hero {
      display: grid;
      place-content: center;
      text-align: center;
    }

    .wordmark {
      font-size: clamp(3.25rem, 11vw, 9.5rem);
      font-weight: 700;
      letter-spacing: -.045em;
      line-height: .9;
      margin: 0;
    }

    .tagline {
      margin: 1.5rem 0 0;
      font-size: clamp(.72rem, 1.1vw, .9rem);
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .controls {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 2;
      font: 11px/1.4 ui-monospace, monospace;
      color: var(--ink-soft);
      display: flex;
      gap: .75rem;
    }

    .controls[hidden] {
      display: none;
    }

    .controls button {
      font: inherit;
      background: none;
      border: 1px solid currentColor;
      color: inherit;
      padding: .25rem .5rem;
      cursor: pointer;
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <canvas class="field" id="field"></canvas>

  <main class="landing">
    <header class="meta"><span>munerate</span><span>The financial core for physical AI</span>
    </header>
    <section class="hero">
      <h1 class="wordmark">munerate</h1>
      <p class="tagline">Finance for intelligence</p>
    </section>
    <footer class="meta"><span>© 2026 munerate</span><span>hello@munerate.com</span></footer>
  </main>

  <div class="controls">
    <button id="toggle">pause</button>
    <button id="theme">plate</button>
    <button id="focus">focus</button>
    <span id="fps">— fps</span>
  </div>

  <script type="module">
    import { createGuillocheField, darkColors, lightColors } from "./dist/field.js";

    const params = new URLSearchParams(location.search);
    const overrides = {};
    // ?motion=0 freezes; ?ui=0 hides controls; any numeric config key can be
    // overridden, nested ones via dot-paths: ?curves=96&liquid.amplitude=0.09
    for (const [k, v] of params) {
      const num = Number(v);
      if (Number.isNaN(num)) continue;
      const path = k.split(".");
      let target = overrides;
      for (const part of path.slice(0, -1)) target = target[part] ??= {};
      target[path[path.length - 1]] = num;
    }

    if (params.get("ui") === "0") document.querySelector(".controls").hidden = true;
    delete overrides.ui;

    const canvas = document.getElementById("field");
    const field = createGuillocheField(canvas, overrides);
    window.field = field;

    let motion = field?.config.motion ?? 1;
    document.getElementById("toggle").onclick = () => {
      motion = motion ? 0 : 1;
      field?.setMotion(motion);
      document.getElementById("toggle").textContent = motion ? "pause" : "play";
    };

    let dark = false;
    const setTheme = (d) => {
      dark = d;
      if (d) document.documentElement.dataset.theme = "dark";
      else delete document.documentElement.dataset.theme;
      field?.setPalette(d ? darkColors : lightColors, d ? 1.3 : 1);
      document.getElementById("theme").textContent = d ? "note" : "plate";
    };
    document.getElementById("theme").onclick = () => setTheme(!dark);
    if (params.get("theme") === "dark") setTheme(true);

    let focused = 0;
    document.getElementById("focus").onclick = () => {
      focused = focused ? 0 : 1;
      field?.setFocus(focused);
    };

    let frames = 0, t0 = performance.now();
    const fpsEl = document.getElementById("fps");
    (function tick(now) {
      frames++;
      if (now - t0 > 1000) { fpsEl.textContent = `${frames} fps`; frames = 0; t0 = now; }
      requestAnimationFrame(tick);
    })(t0);
  </script>
</body>

</html>
